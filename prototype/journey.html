<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Путь клиента: из пуша в перевод — прототип</title>

<!-- Шрифт банка с CDN Альфа-Банка. Файлы в репозиторий не копируются; офлайн страница
     падает на системный фолбэк той же метрики (см. --font-family-alfasans в core-components). -->
<style>
@font-face{font-family:"Alfa Interface Sans";font-style:normal;font-weight:400;font-display:swap;
  src:url("https://alfabank.servicecdn.ru/media/fonts/alfa-interface-sans_regular.woff2") format("woff2")}
@font-face{font-family:"Alfa Interface Sans";font-style:normal;font-weight:500;font-display:swap;
  src:url("https://alfabank.servicecdn.ru/media/fonts/alfa-interface-sans_medium.woff2") format("woff2")}
@font-face{font-family:"Alfa Interface Sans";font-style:normal;font-weight:700;font-display:swap;
  src:url("https://alfabank.servicecdn.ru/media/fonts/alfa-interface-sans_bold.woff2") format("woff2")}

/* ═══ Токены ═══════════════════════════════════════════════════════════════
   Значения сняты с Альфа-Онлайн (тёмная тема, 375×812) и совпадают с переменными
   бандла core-components-styles: имя переменной приложения указано в комментарии. */
:root{
  --color-bg-primary:#121213;                    /* color-dark-base-bg-primary */
  --color-bg-secondary:#1c1c1e;                  /* color-dark-base-bg-secondary */
  --color-specialbg-transparent:rgba(214,214,229,.07); /* color-dark-specialbg-secondary-transparent */
  --color-text-primary:#fffffff0;                /* color-dark-text-primary, rgba(255,255,255,.94) */
  --color-text-secondary:#eeeefb8c;              /* color-dark-text-secondary, rgba(238,238,251,.55) */
  --color-text-tertiary:#e9e9fa5e;               /* color-dark-text-tertiary */
  --color-accent-primary:#f83a2a;                /* color-dark-accent-primary */
  --color-accent-press:#d92a1c;
  --color-status-negative:#ff4837;               /* color-dark-status-negative */
  --color-status-positive:#17d055;               /* color-dark-status-positive */
  --color-border-primary:#36363a;                /* color-dark-border-primary */
  --color-border-secondary:#27272a;              /* color-dark-border-secondary */
  --color-status-attention:#ffb800;

  --border-radius-8:8px; --border-radius-12:12px; --border-radius-20:20px; --border-radius-24:24px;
  --gap-4:4px; --gap-8:8px; --gap-12:12px; --gap-14:14px; --gap-16:16px; --gap-20:20px; --gap-24:24px;

  --font-family-alfasans:"Alfa Interface Sans",system-ui,-apple-system,"Segoe UI",Roboto,
    "Helvetica Neue",Helvetica,sans-serif;

  --phone-w:390px; --phone-h:844px;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:#0a0a0b;color:var(--color-text-primary);
  font-family:var(--font-family-alfasans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;overflow:hidden;
}

/* ── рамка страницы ─────────────────────────────────────────────────────── */
.shell{
  flex:1 1 auto;min-height:0;
  display:grid;grid-template-columns:minmax(250px,330px) minmax(420px,1fr) minmax(230px,290px);
  gap:24px;align-items:start;padding:16px 28px 8px;max-width:1560px;margin:0 auto;width:100%;
}
.left,.right{max-height:100%;overflow:auto;scrollbar-width:thin}
.step-no{font-size:11px;letter-spacing:.10em;text-transform:uppercase;color:var(--color-accent-primary);font-weight:700}
h1{margin:5px 0 8px;font-size:26px;line-height:1.15;letter-spacing:-.01em;font-weight:700}
.lede{color:var(--color-text-secondary);margin:0 0 14px;font-size:14px}
.left h2,.right h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-tertiary);
  margin:16px 0 8px;font-weight:700}
.right h2{margin-top:0}
.left ul{margin:0;padding-left:17px;color:var(--color-text-secondary);font-size:13.5px}
.left li{margin-bottom:5px}
.left li b{color:var(--color-text-primary);font-weight:500}
.prov{margin-top:16px;padding-top:12px;border-top:1px solid var(--color-border-secondary);
  font-size:11.5px;line-height:1.55;color:var(--color-text-tertiary)}
.prov code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;color:var(--color-text-secondary)}

/* ── центр: телефон ─────────────────────────────────────────────────────── */
.stage{display:flex;justify-content:center;align-items:flex-start;height:100%;min-height:0}
.phone-scale{transform-origin:top center}
.phone{
  position:relative;width:var(--phone-w);height:var(--phone-h);
  background:var(--color-bg-primary);border-radius:44px;
  border:1px solid #2b2b30;box-shadow:0 24px 60px rgba(0,0,0,.6);
  overflow:hidden;display:flex;flex-direction:column;
}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:112px;height:30px;
  background:#000;border-radius:16px;z-index:6}
.statusbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;
  padding:14px 26px 4px;font-size:13px;font-weight:600;color:var(--color-text-primary);height:46px}
.statusbar .icons{display:flex;gap:5px;align-items:center;opacity:.9}
.homebar{flex:0 0 auto;display:flex;justify-content:center;padding:6px 0 9px;background:transparent}
.homebar i{display:block;width:134px;height:5px;border-radius:99px;background:rgba(255,255,255,.32)}

/* ── навигационная строка приложения (navigation-bar) ───────────────────── */
.navbar{flex:0 0 auto;display:flex;align-items:center;gap:var(--gap-8);padding:6px var(--gap-12);
  min-height:44px}
.navbar .back{width:32px;height:32px;flex:0 0 32px;display:flex;align-items:center;justify-content:center;
  border-radius:var(--border-radius-8);color:var(--color-text-primary);font-size:22px;line-height:1;cursor:default}
.navbar .ttl{font-size:18px;font-weight:700;letter-spacing:-.01em}
.navbar .sub{font-size:12px;color:var(--color-text-secondary);margin-top:1px}

#body{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.viewport{flex:1 1 auto;min-height:0;overflow:auto;padding:0 var(--gap-16) var(--gap-8);scrollbar-width:none}
.viewport::-webkit-scrollbar{display:none}
.ctabar{flex:0 0 auto;padding:6px var(--gap-16) 10px}

/* ── нижняя панель вкладок (tab-bar) ────────────────────────────────────── */
.tabbar{flex:0 0 auto;display:flex;justify-content:center;background:var(--color-bg-primary);
  box-shadow:0 -1px 0 0 var(--color-border-secondary)}
.tabbar .tab{flex:1 0 0;display:flex;flex-direction:column;align-items:center;
  padding:10px 0 6px;color:var(--color-text-tertiary);gap:2px}
.tabbar .tab.on{color:var(--color-accent-primary)}
.tabbar .tab .lb{font-size:10px;line-height:13px;font-weight:500;color:var(--color-text-secondary)}
.tabbar .tab.on .lb{color:inherit}
.tabbar svg{width:24px;height:24px;display:block}

/* ── экран блокировки ───────────────────────────────────────────────────── */
.lock{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;align-items:center;
  padding:0 var(--gap-16);
  background:radial-gradient(120% 70% at 50% 0%,#221016 0%,#121213 58%,#0d0d0e 100%)}
.lock .date{margin-top:34px;font-size:15px;font-weight:500;color:var(--color-text-secondary)}
.lock .clock{font-size:74px;line-height:1.02;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.lock .push-wrap{margin-top:34px;width:100%}
.lock .hint{margin-top:auto;margin-bottom:16px;font-size:12px;color:var(--color-text-tertiary);text-align:center}

/* карточка уведомления (notification) */
.push{background:var(--color-bg-secondary);border-radius:var(--border-radius-20);
  padding:var(--gap-12) var(--gap-16) var(--gap-16);backdrop-filter:blur(20px)}
.push .head{display:flex;align-items:center;gap:var(--gap-8);font-size:12px;color:var(--color-text-secondary);
  margin-bottom:var(--gap-8)}
.push .head .when{margin-left:auto}
.push .logo{width:22px;height:22px;border-radius:6px;background:var(--color-accent-primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;line-height:1}
.push .t{font-size:16px;font-weight:700;line-height:1.25;margin-bottom:3px}
.push .b{font-size:14px;font-weight:400;color:var(--color-text-primary);line-height:1.35}

/* ── карточки и ячейки ──────────────────────────────────────────────────── */
.card{background:var(--color-bg-secondary);border-radius:var(--border-radius-12);
  padding:var(--gap-14);margin-bottom:10px}
.card.pad0{padding:var(--gap-4) var(--gap-16)}
.sect{font-size:19px;font-weight:700;letter-spacing:-.01em;margin:var(--gap-12) 0 var(--gap-8)}
.caption{font-size:12px;color:var(--color-text-secondary);margin:0 0 var(--gap-8) 2px}

/* pure-cell */
.cell{display:flex;align-items:center;gap:var(--gap-12);padding:9px 0;
  border-bottom:1px solid var(--color-border-secondary)}
.cell:last-child{border-bottom:0}
.cell .ic{width:40px;height:40px;flex:0 0 40px;border-radius:var(--border-radius-12);
  background:var(--color-specialbg-transparent);display:flex;align-items:center;justify-content:center;
  color:var(--color-text-primary)}
.cell .ic svg{width:20px;height:20px}
.cell .txt{flex:1 1 auto;min-width:0}
.cell .k{font-size:16px;font-weight:500;line-height:20px}
.cell .s{font-size:14px;font-weight:400;color:var(--color-text-secondary);line-height:18px;margin-top:1px}
.cell .r{flex:0 0 auto;font-size:14px;color:var(--color-text-secondary);display:flex;align-items:center;gap:6px}
.cell .chev{color:var(--color-text-tertiary);font-size:19px;line-height:1}
.cell .radio{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:1.5px solid var(--color-border-primary)}
.cell .radio.on{border-color:var(--color-accent-primary)}
.cell .radio.on::after{content:"";display:block;width:12px;height:12px;border-radius:50%;
  background:var(--color-accent-primary);margin:3.5px auto}
.cell.edit .k{color:var(--color-text-secondary);font-size:12px;font-weight:400}
.cell.edit .v{font-size:16px;font-weight:500;line-height:22px}

/* ── карточка факта ─────────────────────────────────────────────────────── */
.fact .t{font-size:16px;font-weight:700;line-height:1.25}
.fact .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:var(--gap-8) 0 0;line-height:1.05}
.fact .unit{font-size:14px;color:var(--color-text-secondary);margin-top:3px}
.fact .meas{font-size:14px;font-weight:500;margin-top:var(--gap-8)}
.fact .note{font-size:13px;color:var(--color-text-secondary);margin-top:var(--gap-4)}
.fact.warn .meas{color:var(--color-status-negative)}
.why{margin-top:var(--gap-8);background:none;border:0;padding:0;font:inherit;font-size:14px;font-weight:500;
  color:var(--color-accent-primary);cursor:pointer}
.chart{margin-top:var(--gap-8);position:relative}
.chart svg{display:block;width:100%;height:58px;overflow:visible}
.chart .ax{display:flex;justify-content:space-between;font-size:11px;color:var(--color-text-tertiary);margin-top:5px}

/* status-badge */
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 9px;
  font-size:12px;font-weight:700;line-height:16px}
.badge.neg{background:rgba(255,72,55,.16);color:var(--color-status-negative)}
.badge.pos{background:rgba(23,208,85,.16);color:var(--color-status-positive)}
.badge.att{background:rgba(255,184,0,.16);color:var(--color-status-attention)}

/* ── дельта «курс изменился» ────────────────────────────────────────────── */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap-8);margin-top:var(--gap-12)}
.pair .c{background:var(--color-specialbg-transparent);border-radius:var(--border-radius-12);padding:var(--gap-12)}
.pair .c .k{font-size:11.5px;color:var(--color-text-secondary);line-height:1.3;min-height:30px}
.pair .c .n{font-size:22px;font-weight:700;letter-spacing:-.01em;margin-top:5px}
.pair .c .u{font-size:11.5px;color:var(--color-text-tertiary);margin-top:2px}
.money{margin-top:var(--gap-12);font-size:14px;line-height:1.45;color:var(--color-text-secondary)}
.money b{color:var(--color-text-primary);font-weight:700}
.money div+div{margin-top:6px}

/* ── суммовое поле (amount-input) ───────────────────────────────────────── */
.amt{background:var(--color-bg-secondary);border-radius:var(--border-radius-12);padding:var(--gap-16);
  margin-bottom:var(--gap-12)}
.amt .lab{font-size:12px;color:var(--color-text-secondary)}
.amt .val{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-top:2px;
  display:flex;align-items:baseline}
.amt .cur{margin-left:6px;color:var(--color-text-secondary);font-weight:500}
.amt .caret{display:inline-block;width:2px;height:32px;background:var(--color-accent-primary);
  margin-left:3px;align-self:center}
.amt .hint{font-size:13px;color:var(--color-text-secondary);margin-top:var(--gap-12);line-height:1.4}
.amt .hint b{color:var(--color-text-primary);font-weight:500}
.amt .free{margin-top:var(--gap-8);font-size:13px;font-weight:500;color:var(--color-status-positive)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--gap-8);margin-top:var(--gap-8)}
.keys span{background:var(--color-specialbg-transparent);border-radius:var(--border-radius-8);
  text-align:center;padding:9px 0;font-size:19px;font-weight:500;color:var(--color-text-primary)}

/* ── строки проверки ────────────────────────────────────────────────────── */
.kv{display:flex;justify-content:space-between;gap:var(--gap-12);padding:var(--gap-12) 0;
  border-bottom:1px solid var(--color-border-secondary);font-size:15px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--color-text-secondary);font-weight:400}
.kv .v{font-weight:500;text-align:right}
.kv.total .v{font-size:19px;font-weight:700}

/* ── успех ──────────────────────────────────────────────────────────────── */
.done{text-align:center;padding:var(--gap-24) 0 var(--gap-16)}
.done .ok{width:72px;height:72px;margin:0 auto var(--gap-16);border-radius:50%;
  background:rgba(23,208,85,.16);display:flex;align-items:center;justify-content:center}
.done .ok svg{width:34px;height:34px;color:var(--color-status-positive)}
.done .ok.accent{background:rgba(248,58,42,.16)}
.done .ok.accent svg{color:var(--color-accent-primary)}
.done .t{font-size:22px;font-weight:700}
.done .s{font-size:15px;color:var(--color-text-secondary);margin-top:var(--gap-4)}
.done .demo{font-size:13px;color:var(--color-text-tertiary);margin-top:var(--gap-8)}
.vcard .hd{display:flex;align-items:center;justify-content:space-between;gap:var(--gap-8)}
.vcard .hd .k{font-size:15px;font-weight:500}
.vcard .m{font-size:13px;color:var(--color-text-secondary);margin-top:var(--gap-8);line-height:1.45}
.vcard .m b{color:var(--color-text-primary);font-weight:500}

/* ── шторка (bottom-sheet) ──────────────────────────────────────────────── */
.sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:8;display:none}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--color-bg-secondary);
  border-radius:var(--border-radius-20) var(--border-radius-20) 0 0;padding:var(--gap-12) var(--gap-20) var(--gap-20);
  display:none;max-height:74%;overflow:auto;scrollbar-width:none}
.phone.sheet-open .sheet-back,.phone.sheet-open .sheet{display:block}
.sheet .marker{width:36px;height:4px;border-radius:99px;background:var(--color-border-primary);
  margin:0 auto var(--gap-16)}
.sheet h3{margin:0 0 var(--gap-12);font-size:22px;font-weight:700;letter-spacing:-.01em}
.sheet dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px var(--gap-16);font-size:14px}
.sheet dt{color:var(--color-text-secondary)}
.sheet dd{margin:0;text-align:right;font-weight:500}
.sheet p{font-size:13px;color:var(--color-text-secondary);line-height:1.5;margin:var(--gap-16) 0 0}
.sheet code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}

/* ── кнопки (button) ────────────────────────────────────────────────────── */
.btn{display:block;width:100%;border:0;border-radius:var(--border-radius-12);padding:14px 16px;
  font:inherit;font-size:16px;font-weight:500;cursor:pointer;text-align:center}
.btn+.btn{margin-top:var(--gap-8)}
.btn.accent{background:var(--color-accent-primary);color:#fff}
.btn.accent:active{background:var(--color-accent-press)}
.btn.secondary{background:var(--color-specialbg-transparent);color:var(--color-text-primary)}
.footnote{margin-top:6px;font-size:11.5px;color:var(--color-text-tertiary);text-align:center;line-height:1.4}

/* ── правая колонка ─────────────────────────────────────────────────────── */
.act{display:flex;width:100%;align-items:center;gap:10px;background:var(--color-bg-secondary);
  border:1px solid transparent;border-radius:var(--border-radius-12);padding:10px 12px;margin-bottom:8px;
  font:inherit;color:var(--color-text-primary);text-align:left;cursor:pointer}
.act:hover{border-color:var(--color-border-primary)}
.act.primary{background:var(--color-accent-primary);color:#fff}
.act .txt{flex:1 1 auto;min-width:0}
.act .n{display:block;font-size:14px;font-weight:500;line-height:1.25}
.act .s{display:block;font-size:11.5px;color:var(--color-text-secondary);margin-top:2px;line-height:1.3}
.act.primary .s{color:rgba(255,255,255,.8)}
.act kbd{flex:0 0 auto;font:inherit;font-size:11px;font-weight:700;color:var(--color-text-tertiary);
  border:1px solid var(--color-border-primary);border-radius:6px;padding:1px 6px}
.act.primary kbd{color:rgba(255,255,255,.85);border-color:rgba(255,255,255,.4)}
.act[aria-current="true"]{border-color:var(--color-accent-primary)}
.steps .act{padding:7px 12px;margin-bottom:5px;background:transparent}
.steps .act .n{font-size:12.5px;font-weight:400;color:var(--color-text-secondary)}
.steps .act[aria-current="true"] .n{color:var(--color-text-primary);font-weight:500}
.sep{height:1px;background:var(--color-border-secondary);margin:14px 0}
.hint{font-size:11.5px;color:var(--color-text-tertiary);line-height:1.5;margin:0}
.hint code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}

.disclaimer{flex:0 0 auto;text-align:center;font-size:11.5px;color:var(--color-text-tertiary);
  padding:9px 28px 12px;border-top:1px solid var(--color-border-secondary);margin:0 28px}

@media (max-width:1150px){
  body{overflow:auto;height:auto}
  .shell{grid-template-columns:1fr}
  .stage{order:-1}
  .left,.right{max-height:none;overflow:visible}
}
</style>
</head>
<body>

<div class="shell">
  <aside class="left">
    <div class="step-no" id="stepNo">Экран 1 из 8</div>
    <h1 id="stepTitle">—</h1>
    <p class="lede" id="stepLede">—</p>
    <h2>Что на экране</h2>
    <ul id="stepList"></ul>
    <div class="prov" id="prov"></div>
  </aside>

  <main class="stage" id="stage">
    <div class="phone-scale" id="phoneScale">
      <div class="phone" id="phone">
        <div class="notch" aria-hidden="true"></div>
        <div class="statusbar">
          <span id="clock">19:07</span>
          <span class="icons" aria-hidden="true">
            <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
            <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 10.6 6 8.3a3 3 0 0 1 4 0l-2 2.3Zm-4-4.6a7 7 0 0 1 8 0l-1.3 1.5a5 5 0 0 0-5.4 0L4 6ZM.9 2.9a11.4 11.4 0 0 1 14.2 0L13.8 4.4a9.4 9.4 0 0 0-11.6 0L.9 2.9Z"/></svg>
            <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="currentColor" opacity=".45"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><path d="M23.5 4v4a2.4 2.4 0 0 0 0-4Z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <div id="body"></div>
        <div class="homebar"><i></i></div>
        <div class="sheet-back" id="sheetBack"></div>
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
  </main>

  <aside class="right">
    <h2>Действия</h2>
    <div id="acts"></div>
    <div class="sep"></div>
    <h2>Экраны</h2>

var STEP_NAMES = ["Пуш на блокировке","Экран перевода","Получатель","Сумма","Проверка",
  "Готово и вердикт","Курс изменился","Напомним при новом сигнале"];

/* ═══ Состояние и отрисовка ════════════════════════════════════════════════ */

var state = { step:0, ctx:"live", sheet:"" };

function readState(){
  var q = window.location.search;
  var m = /[?&]step=(\d)/.exec(q);
  if (m && SCREENS[+m[1]]) state.step = +m[1];
  m = /[?&]ctx=(live|changed|closed)/.exec(q);
  if (m) state.ctx = m[1];
  if (/[?&]sheet=why/.test(q)) state.sheet = "why";
  if (state.step === 6 && state.ctx === "live") state.ctx = "changed";
}

function currentCtx(){ return CTX[state.ctx] || CTX.live; }

function render(){
  var s = SCREENS[state.step], ctx = currentCtx(), i;

  document.getElementById("stepNo").textContent = "Экран " + (state.step + 1) + " из " + SCREENS.length;
  document.getElementById("stepTitle").textContent = s.title;
  document.getElementById("stepLede").textContent = s.lede;
  var li = "";
  for (i=0;i<s.list.length;i++) li += "<li>" + s.list[i] + "</li>";
  document.getElementById("stepList").innerHTML = li;

  document.getElementById("clock").textContent = s.clock || ctx.clock;

  var html = "";
  if (s.nav) html += navbar(s.nav[0], s.nav[1]);
  html += s.bare ? s.render(ctx) : '<div class="viewport">' + s.render(ctx) + '</div>';
  if (s.cta){
    html += '<div class="ctabar">';
    for (i=0;i<s.cta.length;i++)
      html += '<button class="btn ' + s.cta[i][1] + '" type="button" data-do="' + s.cta[i][2] + '">' +
        s.cta[i][0] + '</button>';
    html += (s.foot === false ? '' : ctaFootnote()) + '</div>';
  }
  if (s.tab) html += tabbar(s.tab);
  document.getElementById("body").innerHTML = html;

  document.getElementById("sheet").innerHTML = state.sheet === "why" ? sheetWhy(ctx) : "";
  document.getElementById("phone").className = "phone" + (state.sheet ? " sheet-open" : "");

  var acts = "";
  for (i=0;i<s.acts.length;i++){
    var a = s.acts[i];
    acts += '<button class="act' + (a[3] ? " primary" : "") + '" type="button" data-do="' + a[2] + '">' +
      '<span class="txt"><span class="n">' + a[0] + '</span><span class="s">' + a[1] + '</span></span></button>';
  }
  document.getElementById("acts").innerHTML = acts;

  var steps = "";
  for (i=0;i<SCREENS.length;i++){
    steps += '<button class="act" type="button" data-do="go:' + i + '" aria-current="' + (i === state.step) + '">' +
      '<span class="txt"><span class="n">' + i + '. ' + STEP_NAMES[i] + '</span></span><kbd>' + i + '</kbd></button>';
  }
  document.getElementById("steps").innerHTML = steps;

  document.getElementById("permalink").textContent =
    "?step=" + state.step + (state.ctx !== "live" ? "&ctx=" + state.ctx : "") + (state.sheet ? "&sheet=why" : "");

  document.getElementById("prov").innerHTML =
    "Пуш — <code>reports/latest/stream_decisions.csv</code>, TJS, 09.06.2026, код <code>" + RUN_HASH + "</code>.<br>" +
    "Курсы и ряд графика — <code>data/raw/cbr_daily.csv</code>, снимок ЦБ РФ 03.09.2026.<br>" +
    "Текст уведомления — шаблон <code>level_stall</code> из <code>fxmoment.texts.library</code>.<br>" +
    "Сумма 30 000 ₽ — <code>docs/product/customer-journey.md</code>, юнит-экономика.<br>" +
    "Компоненты и токены — Альфа-Онлайн и <code>core-ds/core-components</code> (MIT).<br>" +
    "Получатель, банк и назначение вымышлены: клиентских данных в проекте нет.";

  fit();
}

/* Телефон 390×844 не всегда влезает в окно — масштабируем целиком, а не режем контент. */
function fit(){
  var stage = document.getElementById("stage"), sc = document.getElementById("phoneScale");
  if (window.innerWidth <= 1150){ sc.style.transform = ""; return; }
  var k = Math.min(1, (stage.clientHeight - 8) / 844);
  sc.style.transform = k < 1 ? "scale(" + k.toFixed(4) + ")" : "";
}

function act(cmd){
  var p = cmd.split(":");
  if (p[0] === "go"){
    state.step = +p[1];
    if (p[2]) state.ctx = p[2];
    if (state.step === 6 && state.ctx === "live") state.ctx = "changed";
    if (state.step === 0) state.ctx = "live";
    state.sheet = "";
  } else if (p[0] === "ctx"){
    state.ctx = p[1];
  } else if (p[0] === "sheet"){
    state.sheet = p[1] || "";
  }
  render();
}

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-do],[data-sheet]") : null;
  if (!t) {
    if (e.target.closest && e.target.closest("#sheetBack")) { state.sheet = ""; render(); }
    return;
  }
  if (t.hasAttribute("data-do")) act(t.getAttribute("data-do"));
  else { state.sheet = t.getAttribute("data-sheet") || ""; render(); }
});

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && state.sheet){ state.sheet = ""; render(); return; }
  if (e.key >= "0" && e.key <= "7"){ act("go:" + e.key); }
});

window.addEventListener("resize", fit);

readState();
render();
</script>

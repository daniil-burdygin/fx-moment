[project]
name = "fxmoment"
version = "0.1.0"
description = "Сигнальный слой для трансграничных переводов: когда подсказать клиенту выгодный момент. AI Product Hack 2026, кейс 455 Альфа-Банка"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.scripts]
fxmoment = "fxmoment.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fxmoment"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
